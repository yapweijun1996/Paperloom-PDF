name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_PUBLIC_BASE_PATH: /Paperloom-PDF
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install PDF interoperability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl qpdf poppler-utils fonts-liberation
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify release
        run: npm run verify:release
      - name: Check coverage thresholds
        run: npm run test:coverage
      - name: Test static build in Chromium
        run: npm run test:e2e
